# ============================================
# Development Environment Configuration
# Tale Blog - Blade MVC
# ============================================

app.name=tale
app.devMode=true

# Error pages
mvc.view.404=/comm/error_404.html
mvc.view.500=/comm/error_500.html

# Upload directory
mvc.statics=/upload

# Feature toggles
app.support_163_music=true
app.support_gist=true

# Logging - verbose for development
com.blade.logger.org.sql2o=debug
com.blade.logger.com.blade.server.netty.StaticFileHandler=debug
com.blade.logger.dir=./logs
