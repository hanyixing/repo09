## ============================================
## 开发环境配置 (Development)
## Blade 运行时通过 --app.env=dev 加载本文件, 覆盖 application.properties
## ============================================
app.env=dev

# 开发模式: 使用项目根目录下的 tale.db, 模板/静态资源热加载
app.devMode=true

# 服务监听地址与端口
server.address=0.0.0.0
server.port=9000

# 日志: 开发环境输出更详细的日志, 便于调试
com.blade.logger.dir=./logs
com.blade.logger.com.tale=debug
com.blade.logger.org.sql2o=debug
