# ============================================
# Test Environment Configuration
# Tale Blog - Blade MVC
# ============================================

app.name=tale
app.devMode=true

# Error pages
mvc.view.404=/comm/error_404.html
mvc.view.500=/comm/error_500.html

# Upload directory
mvc.statics=/upload

# Feature toggles
app.support_163_music=false
app.support_gist=false

# Logging - minimal for test runs
com.blade.logger.org.sql2o=warn
com.blade.logger.com.blade.server.netty.StaticFileHandler=warn
com.blade.logger.dir=./logs
