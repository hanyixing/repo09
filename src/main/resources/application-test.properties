## ============================================
## 测试环境配置 (Test)
## Blade 运行时通过 --app.env=test 加载本文件, 覆盖 application.properties
## 用于自动化测试 / CI 环境
## ============================================
app.env=test

# 测试模式开启 devMode, 使用工作目录下的 tale.db, 避免污染生产数据
app.devMode=true

# 服务端口与开发环境区分, 便于本地并行运行
server.address=0.0.0.0
server.port=9001

# 日志: 测试环境只保留警告及以上, 保持 CI 输出干净
com.blade.logger.dir=./logs
com.blade.logger.root=warn
com.blade.logger.org.sql2o=warn
